[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/learn_mcp_server"]

[project]
name = "learn-mcp-server"
version = "0.2.0"
description = "A learning MCP server built with FastMCP."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "TangRuoJie" }
]
license = "MIT"
keywords = ["mcp", "fastmcp", "model-context-protocol", "learning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "fastmcp>=4.1.0,<5",
    "mcp>=2.3.0,<3",
    "starlette>=1.3.1,<2",
]

[project.scripts]
learn-mcp-server = "learn_mcp_server.server:main"

[dependency-groups]
dev = [
    "pytest",
    "ruff>=0.16,<0.17",
    "httpx2>=2.13.1,<3",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "RUF022"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore:SelectableGroups dict interface is deprecated:DeprecationWarning:opentelemetry.*",
    "error::fastmcp.exceptions.FastMCPDeprecationWarning",
]

[project.urls]
Homepage = "https://github.com/TangRj-Git/learn-mcp-server"
Repository = "https://github.com/TangRj-Git/learn-mcp-server"
Issues = "https://github.com/TangRj-Git/learn-mcp-server/issues"
