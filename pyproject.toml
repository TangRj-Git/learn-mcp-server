[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "learn-mcp-server"
version = "0.1.0"
description = "A learning MCP server built with FastMCP."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "TangRuoJie" }
]
license = "MIT"
keywords = ["mcp", "fastmcp", "model-context-protocol", "learning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "fastmcp",
]

[project.scripts]
learn-mcp-server = "learn_mcp_server.server:main"

[dependency-groups]
dev = [
    "pytest",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore:SelectableGroups dict interface is deprecated:DeprecationWarning:opentelemetry.*",
]

[tool.hatch.build.targets.wheel]
packages = ["src/learn_mcp_server"]

[project.urls]
Homepage = "https://github.com/TangRj-Git/learn-mcp-server"
Repository = "https://github.com/TangRj-Git/learn-mcp-server"
Issues = "https://github.com/TangRj-Git/learn-mcp-server/issues"
